name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: ${{ matrix.check }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        check: [pre-commit, tests, pyright]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
      - name: Install dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r requirements.txt
      - name: Run pre-commit
        if: matrix.check == 'pre-commit'
        run: .venv/bin/pre-commit run --all-files --show-diff-on-failure
      - name: Run tests
        if: matrix.check == 'tests'
        run: .venv/bin/python -m pytest
      - name: Run Pyright
        if: matrix.check == 'pyright'
        run: .venv/bin/pyright
